# This workflow will build and publish the Gradle plugin to the Gradle Plugin Portal.
# It is triggered whenever a new version tag (e.g., v1.0.2) is pushed.

name: Publish Gradle Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up JDK 11, which is required by your project
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Grant execute permission to the gradlew wrapper
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Run checks (tests, code quality, etc.)
      - name: Run checks
        run: ./gradlew check

      # 5. Publish to Gradle Plugin Portal
      - name: Publish to Gradle Plugin Portal
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}