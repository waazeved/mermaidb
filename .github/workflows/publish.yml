# This workflow will build and publish the Gradle plugin to the Gradle Plugin Portal.
# It is triggered on every push to the 'main' branch.

name: Publish Gradle Plugin on Main

on:
  push:
    branches:
      - 'main'

jobs:
  publish:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up JDK 11, which is required by your project
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Grant execute permission to the gradlew wrapper
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Run checks (tests, code quality, etc.)
      #    If this step fails, the workflow will stop and the plugin will not be published.
      - name: Run checks
        run: ./gradlew check

      # 5. Publish to Gradle Plugin Portal
      #    This step will fail the workflow if publishing is not possible.
      - name: Publish to Gradle Plugin Portal
        run: |
          ./gradlew publishPlugins || {
            echo "::warning::Could not publish plugin. This is expected if the version in build.gradle has not been updated."
            exit 1
          }
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
