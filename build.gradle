plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id "com.github.jakemarsden.git-hooks" version "0.0.2"
    id "jacoco"
    id 'org.barfuin.gradle.jacocolog' version '3.1.0'
    id "name.remal.sonarlint" version "7.0.1"
}

group = 'com.waltsoft'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
        showStandardStreams = (System.getenv('DEBUG') != null)
    }

    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'CLASS'
                minimum = 0.50
            }
        }

        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.40
            }
        }

    }
}

sonarLint {
    ignoreFailures = false
}

tasks.named('check') {
    dependsOn 'sonarlintMain'
    dependsOn 'jacocoTestCoverageVerification'
}

gitHooks {
    hooks = ['pre-commit': 'check']
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

gradlePlugin {
    plugins {
        mermaidbPlugin {
            id = 'com.waltsoft.mermaidb'
            implementationClass = 'com.waltsoft.mermaidb.MermaidbPlugin'
        }
    }
}
